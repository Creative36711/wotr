[package]
name = "war-of-the-ring"
version = "0.43.0"
description = "War of the Ring global campaign for BFME2"
authors = ["WotR Remaster Team"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "war_of_the_ring_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tauri-plugin-dialog = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
